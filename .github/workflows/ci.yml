# CI: lint and test the cebeo-client package across Python 3.10-3.12.
# Runs on the self-hosted `ci` runner pool inside official python:* containers
# (matrix-versioned for test, 3.12 for lint), with pip cache bind-mounted from
# the runner host for fast, isolated dependency installs.
# Canon: bess-documentation/infrastructure/self-hosted-runner-ci-patterns.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, ci]
    timeout-minutes: 15
    container:
      image: python:${{ matrix.python-version }}
      volumes:
        - /opt/gh-runner-cache/pip:/github/home/.cache/pip
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Capture host workspace UID
        id: host_ids
        run: |
          echo "uid=$(stat -c '%u' "$GITHUB_WORKSPACE/..")" >> "$GITHUB_OUTPUT"
          echo "gid=$(stat -c '%g' "$GITHUB_WORKSPACE/..")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests

      - name: Run tests
        run: |
          pytest -v --cov=cebeo_client --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Restore workspace ownership
        if: always()
        run: |
          chown -R ${{ steps.host_ids.outputs.uid }}:${{ steps.host_ids.outputs.gid }} "$RUNNER_WORKSPACE"

  lint:
    runs-on: [self-hosted, ci]
    timeout-minutes: 15
    container:
      image: python:3.12
      volumes:
        - /opt/gh-runner-cache/pip:/github/home/.cache/pip
    steps:
      - name: Capture host workspace UID
        id: host_ids
        run: |
          echo "uid=$(stat -c '%u' "$GITHUB_WORKSPACE/..")" >> "$GITHUB_OUTPUT"
          echo "gid=$(stat -c '%g' "$GITHUB_WORKSPACE/..")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check formatting
        run: |
          ruff format --check src tests

      - name: Check linting
        run: |
          ruff check src tests

      - name: Restore workspace ownership
        if: always()
        run: |
          chown -R ${{ steps.host_ids.outputs.uid }}:${{ steps.host_ids.outputs.gid }} "$RUNNER_WORKSPACE"
